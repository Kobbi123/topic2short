const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

async function saveUser(user) {
  const { error } = await supabase.from('users').upsert({
    id: user.uid,
    email: user.email,
    plan: 'free',
    daily_transcriptions: 0,
    last_reset: new Date().toISOString().split('T')[0]
  }, { onConflict: 'id' });
  if (error) console.error(error);
  else console.log("✅ Saved to Supabase", user.email);
}

async function doLogin() {
  try {
    console.log("Logging in...");
    const result = await signInWithPopup(auth, provider);
    await saveUser(result.user);
    alert("Welcome " + result.user.email + " ✅ Saved to Supabase!");
    location.reload();
  } catch(e) {
    console.error(e);
    alert("Login error: " + e.message);
  }
}

function attach() {
  const buttons = document.querySelectorAll('button, a');
  buttons.forEach(btn => {
    const txt = (btn.textContent || '').trim();
    if (txt === 'Log in' || txt === 'Get Started' || txt.includes('Get Started')) {
      // Remove old scroll behavior by cloning
      if (!btn.dataset.loginFixed) {
        btn.dataset.loginFixed = "true";
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopImmediatePropagation();
          doLogin();
        }, true);
        console.log("Fixed button:", txt);
      }
    }
  });
}

// Attach now and after delay (React renders late)
attach();
setTimeout(attach, 1000);
setTimeout(attach, 3000);
setInterval(attach, 2000);

onAuthStateChanged(auth, (user) => {
  if (user) {
    console.log("User already logged in:", user.email);
    saveUser(user);
    // Show email in header if possible
    const header = document.querySelector('header');
    if (header && !document.getElementById('userBadge')) {
      const badge = document.createElement('div');
      badge.id = 'userBadge';
      badge.textContent = user.email + ' ✅';

      header.appendChild(badge);
    }
  }
});
